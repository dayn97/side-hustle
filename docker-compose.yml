services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://inkwell:inkwell@db:5432/inkwell?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts && node server.js"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkwell
      POSTGRES_PASSWORD: inkwell
      POSTGRES_DB: inkwell
    volumes: ["inkwell_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkwell -d inkwell"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  inkwell_pg:
